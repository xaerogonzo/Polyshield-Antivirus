name: build-smoke

# Builds the installer and runs the install cycle on a throwaway runner.
#
# tests.yml proves the code; it cannot prove the PRODUCT. A pin that predates an
# import, a runtime that cannot install its own dependencies, an installer that
# does not compile -- none of those fail a unit test, and each one has shipped
# green (see CHANGELOG.md, "Fixed"). This job builds what a release builds, from a
# clean checkout, and asks the result whether it works.
#
# A build takes tens of minutes and almost no change can break it, so on pull
# requests it runs only when the diff touches something that can (the `changes`
# job below). It also runs weekly and on demand, since the things that rot are
# outside this repository (Nuitka, the runner image, the python.org download,
# PolyBedrock's pinned commit).
#
# NO `paths:` FILTER ON THE TRIGGER, on purpose. A workflow filtered at the
# trigger does not run at all for a pull request that matches nothing, so it
# reports no check, and a check that is required but never reported blocks the
# merge forever. The filtering lives in a job instead, and `build-smoke-gate`
# ALWAYS reports. That gate is the one name to mark as a required status check.
#
# UNSIGNED, deliberately: a signing certificate is a secret and this workflow
# runs on pull requests. Signing is verified by hand per docs/RELEASING.md.
on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Cheap and on Linux: it only reads the diff. It FAILS CLOSED -- if it cannot
    # work out what changed, the gate goes red rather than quietly deciding that
    # nothing relevant did.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Both ends of the diff must be present; a shallow clone has neither.
          fetch-depth: 0

      - name: Decide whether this change can affect the build
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Shell globs, one per line, matched with `case` (so `*` crosses `/`).
          # Anything that can change what a release builds or how it is verified.
          RELEVANT: |
            build.ps1
            build.bat
            installer/*
            requirements.txt
            requirements-build.txt
            tools/engine_probe.py
            tools/build_probe.py
            tools/sandbox_verify.ps1
            tools/ci/*
            src/ui/core/paths.py
            .github/workflows/build-smoke.yml
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "event is '$EVENT', not a pull request: always build"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "changed files:"
          echo "$changed" | sed 's/^/  /'
          relevant=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            while IFS= read -r pattern; do
              [ -n "$pattern" ] || continue
              case "$file" in
                $pattern) relevant=true; echo "relevant: $file (matches $pattern)" ;;
              esac
            done <<< "$RELEVANT"
          done <<< "$changed"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # The product is Windows-only, and this runner is disposable: the install
    # cycle registers a service and rewrites %ProgramData%\PolyShield ACLs, which
    # is exactly what must never be done on a development machine.
    runs-on: windows-latest
    timeout-minutes: 90

    defaults:
      run:
        # Explicit: the default shell changes with the runner, and a bash script
        # handed to pwsh fails at parse time having done nothing
        # (docs/gotchas/ci-green-for-the-wrong-reason.md #2).
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Create the build environment
        # build.ps1 looks for kicomav_env\Scripts\python.exe by name.
        run: |
          python -m venv kicomav_env
          .\kicomav_env\Scripts\python.exe -m pip install --upgrade pip
          .\kicomav_env\Scripts\python.exe -m pip install -r requirements.txt -r requirements-build.txt

      - name: Report the environment
        run: |
          .\kicomav_env\Scripts\python.exe --version
          .\kicomav_env\Scripts\python.exe -m nuitka --version
          .\kicomav_env\Scripts\python.exe -m pip show polybedrock-core | Select-String "Version|Location|Editable"

      - name: Install Inno Setup
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is still not installed at $iscc" }
          & $iscc /? 2>&1 | Select-Object -First 1

      - name: Build the distribution (GUI, runtime, service)
        # build.ps1 gates itself: the path probe, and the engine probe on the
        # frozen binary including K2 detecting its Dummy signature and passing a
        # clean control. Output is teed to a file so a failure leaves a log.
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1 -BuildRuntime -Onefile -Target all 2>&1 |
            Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed (exit $LASTEXITCODE)" }

      - name: Compile the installer
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1 -NoClean -Target installer 2>&1 |
            Tee-Object -FilePath build_installer.log
          if ($LASTEXITCODE -ne 0) { throw "installer build failed (exit $LASTEXITCODE)" }
          $setup = Get-ChildItem dist -Filter "PolyShield-Setup-*.exe"
          if (-not $setup) { throw "no PolyShield-Setup-*.exe in dist\" }
          $setup | ForEach-Object { "{0}  {1} MB" -f $_.Name, [math]::Round($_.Length / 1MB, 1) }

      - name: Run the install cycle
        # tools/sandbox_verify.ps1 installs the product, registers the service,
        # checks the data root and privilege boundary, uninstalls, and writes
        # verify.json. It sets no exit code, so the next step reads the file.
        #
        # Bounded on its own: the first run finished all its checks and then never
        # returned, and the only limit was the 90-minute job timeout. A step that
        # times out is a failed step, and the steps after it still run.
        #
        # -SkipSandboxPreconditions: a hosted runner has Python and has just run
        # the build's gate, so two checks that describe the Windows Sandbox cannot
        # hold. They are reported as SKIPPED, not passed. -SkipFullReport: the deep
        # JSON serialisation is what never returned.
        timeout-minutes: 30
        run: |
          New-Item -ItemType Directory -Force artifacts\ci | Out-Null
          powershell -ExecutionPolicy Bypass -File .\tools\sandbox_verify.ps1 `
            -DistDir "$env:GITHUB_WORKSPACE\dist" `
            -ResultsDir "$env:GITHUB_WORKSPACE\artifacts\ci" `
            -SkipSandboxPreconditions -SkipFullReport 2>&1 |
            Tee-Object -FilePath verify.log

      - name: Prove that Setup refuses when the service cannot be registered
        # The install cycle shows a GOOD install works. This shows a BAD one is
        # refused: tools/ci/refusal_test.ps1 builds an installer from a payload
        # whose service source exits 3, runs it, and requires a non-zero exit, no
        # registered service, and a log that names the failed step. An antivirus
        # that finishes "successfully" with no service looks protected and is not.
        #
        # Skipped (not run) if the cycle step failed: a cycle that left state
        # behind would make "no service afterwards" prove nothing, and the verdict
        # step below reports that failure regardless. The script refuses to run
        # outside a CI runner; this is a disposable one.
        timeout-minutes: 30
        run: |
          New-Item -ItemType Directory -Force artifacts\ci | Out-Null
          powershell -ExecutionPolicy Bypass -File .\tools\ci\refusal_test.ps1 `
            -DistDir "$env:GITHUB_WORKSPACE\dist" `
            -ResultsDir "$env:GITHUB_WORKSPACE\artifacts\ci" 2>&1 |
            Tee-Object -FilePath refusal.log
          if ($LASTEXITCODE -ne 0) { throw "the refusal test failed (exit $LASTEXITCODE)" }

      - name: Fail on any failed check, or if the cycle did not finish
        # Its own step, and `if: always()`: a failed cycle must not hide this
        # verdict, and a cycle that hung writes NO verify.json -- which must read
        # as a failure rather than as nothing to check.
        if: always()
        run: |
          $f = "artifacts\ci\verify.json"
          if (-not (Test-Path $f)) { throw "verify.json is missing: the install cycle did not finish" }
          $r = Get-Content $f -Raw | ConvertFrom-Json
          "{0} passed, {1} failed" -f $r.passed, $r.failed
          $r.checks | Where-Object { -not $_.pass } |
            ForEach-Object { "FAILED: {0} - {1}" -f $_.name, $_.detail }
          # Said out loud, so a green run can never hide what was not checked.
          @($r.skipped) | Where-Object { $_ } |
            ForEach-Object { "SKIPPED: {0} - {1}" -f $_.name, $_.reason }
          if ($r.failed -ne 0) { throw "$($r.failed) install-cycle check(s) failed" }
          # A floor against a cycle that "passed" because most of it was skipped.
          # Measured: the first complete run recorded 49 checks, 45 passing. 40
          # sits below that with room for the two skipped, and far above a cycle
          # that stopped early.
          if ($r.passed -lt 40) { throw "only $($r.passed) checks passed; the cycle normally records about 47" }

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-smoke
          path: |
            build.log
            build_installer.log
            verify.log
            refusal.log
            artifacts/ci/
            dist/PolyShield-Setup-*.exe
          if-no-files-found: ignore
          retention-days: 5

  build-smoke-gate:
    # THE check to require. It always runs and always reports, whatever the diff
    # was, so requiring it can never leave a pull request waiting for a status
    # that was never going to arrive.
    #
    # It passes in exactly two cases, and `skipped` is only one of them when the
    # skip was the intended one (docs/gotchas/ci-green-for-the-wrong-reason.md #1:
    # a skipped job reads as "not applicable" even when it means "something
    # upstream broke"):
    #
    #   relevant=true  and build succeeded   the build ran and was clean
    #   relevant=false and build skipped     nothing here can affect the build
    #
    # Anything else fails: a failed or cancelled build, a build skipped when the
    # diff said it was needed, or a `changes` job that did not produce an answer.
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Require a clean build, or a diff that cannot affect it
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES_RESULT | relevant: '$RELEVANT' | build: $BUILD_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::the change detector did not finish ($CHANGES_RESULT); cannot say whether the build was needed"
            exit 1
          fi
          case "$RELEVANT/$BUILD_RESULT" in
            true/success)
              echo "build ran and passed" ;;
            false/skipped)
              echo "no build-relevant file changed; the build was correctly skipped" ;;
            *)
              echo "::error::relevant='$RELEVANT' but the build result was '$BUILD_RESULT'"
              exit 1 ;;
          esac
